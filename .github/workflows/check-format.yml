name: Checkpatch

on:
  push:       
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl curl git ca-certificates

      - name: Download checkpatch.pl
        run: |
          curl -sSfL https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl -o ./checkpatch.pl
          chmod +x ./checkpatch.pl
          echo "$PWD" >> $GITHUB_PATH

      - name: Find source files
        id: find_files
        run: |
          files=$(find src -type f \( -name '*.c' -o -name '*.h' -o -name '*.S' -o -name '*.cpp' -o -name '*.hpp' \) -print)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run checkpatch on src
        if: steps.find_files.outputs.files != ''
        run: |
          set -o pipefail
          IFS=$'\n' read -r -d '' -a filelist <<< "${{ steps.find_files.outputs.files }}" || true
          printf '%s\n' "${filelist[@]}" | xargs ./checkpatch.pl --strict --no-tree 2>&1 | tee checkpatch.out || true

          if grep -Eq "ERROR:|FIXME:|unable to parse" checkpatch.out; then
            echo "::error file=checkpatch.out::checkpatch found errors"
            head -n 200 checkpatch.out || true
            exit 1
          fi

          WARN_COUNT=$(grep -c "^WARNING:" checkpatch.out || true)
          if [ "$WARN_COUNT" -gt 50 ]; then
            echo "::warning::Too many checkpatch warnings: $WARN_COUNT"
          fi

      - name: Skip checkpatch (no source files)
        if: steps.find_files.outputs.files == ''
        run: |
          echo "No source files found under src. Skipping checkpatch."

      - name: Upload checkpatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpatch-report
          path: checkpatch.out
